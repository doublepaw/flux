{{- $dbUrl := .Values.postgres.externalUrl | default (printf "postgres://postgres:%s@%s-postgres:5432/%s" .Values.postgres.password .Release.Name .Values.postgres.database) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-broker
spec:
  replicas: {{ .Values.broker.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-broker
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-broker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: broker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ $dbUrl | quote }}
            - name: WS_ADDR
              value: "0.0.0.0:9000"
            - name: ADMIN_ADDR
              value: "0.0.0.0:9001"
            - name: OBJECT_STORE
              value: {{ .Values.broker.objectStore | quote }}
            - name: OBJECT_STORE_BUCKET
              value: {{ .Values.broker.bucket | quote }}
            - name: OBJECT_STORE_PREFIX
              value: {{ .Values.broker.keyPrefix | quote }}
            - name: FLUSH_INTERVAL_MS
              value: {{ .Values.broker.flushIntervalMs | quote }}
            - name: SEGMENT_MAX_BYTES
              value: {{ .Values.broker.segmentMaxBytes | quote }}
            - name: READAHEAD_MAX_BYTES
              value: {{ .Values.broker.readaheadMaxBytes | quote }}
            - name: PG_POOL_SIZE
              value: {{ .Values.broker.pgPoolSize | quote }}
            {{- range .Values.broker.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - containerPort: 9000
            - containerPort: 9001
          resources:
            {{- toYaml .Values.broker.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-broker
spec:
  selector:
    app: {{ .Release.Name }}-broker
  ports:
    - name: ws
      port: 9000
      targetPort: 9000
    - name: admin
      port: 9001
      targetPort: 9001
