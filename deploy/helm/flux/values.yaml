image:
  repository: flux
  tag: latest
  pullPolicy: IfNotPresent

broker:
  replicas: 1
  # fs | s3 | gcs | azure
  objectStore: fs
  bucket: flux
  keyPrefix: bench
  flushIntervalMs: 50
  # Flush quantum: buffer flushes at whichever comes first. Smaller values
  # cut ack latency (smaller PUTs) at the cost of more objects/commits.
  bufferMaxBytes: 268435456
  bufferMaxWaitMs: 200
  pgPoolSize: 50
  # One read = one segment: keep equal to bench.maxBytes
  segmentMaxBytes: 268435456
  # Read-ahead cache (prefetch next segment per reader); 0 disables
  readaheadMaxBytes: 4294967296
  # Concurrent flushes (puts overlap, commits stay ordered)
  flushPipelineDepth: 4
  resources:
    requests:
      cpu: "8"
      memory: 16Gi
    limits:
      cpu: "16"
      memory: 24Gi
  # Extra env vars (e.g. AZURE_STORAGE_ACCOUNT_NAME, S3_ENDPOINT)
  extraEnv: []

serviceAccount:
  create: true
  name: flux-broker
  # Cloud identity annotations:
  #   AWS IRSA:  eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/<role>
  #   GKE WI:    iam.gke.io/gcp-service-account: <gsa>@<project>.iam.gserviceaccount.com
  #   Azure WI:  azure.workload.identity/client-id: <client-id>
  annotations: {}

postgres:
  # In-cluster single-node Postgres for benchmarks. Set enabled=false and
  # externalUrl to use a managed database instead.
  enabled: true
  image: postgres:16
  password: flux
  database: flux
  maxConnections: 500
  sharedBuffers: 2GB
  storage: emptyDir  # benchmark-only; data is disposable
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
  externalUrl: ""

bench:
  # Render the benchmark Job (helm upgrade --set bench.enabled=true ...)
  enabled: false
  topic: bench
  # Topics (named bench-0..N-1 when >1); writers must divide evenly
  topics: 1
  writers: 40
  requestsPerWriter: 2500
  recordsPerBatch: 128
  recordSize: 1024
  maxInFlight: 64
  fetchReaders: 8
  # Keep equal to broker.segmentMaxBytes
  maxBytes: 268435456
  # Zero-copy fetch: client-side segment decode
  rawReads: false
  skipFetch: false
  # Produce and fetch simultaneously (readers tail the producers)
  concurrent: false
  resources:
    requests:
      cpu: "8"
      memory: 8Gi
